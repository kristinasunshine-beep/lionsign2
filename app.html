<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LIONSIGN</title>

<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&display=swap" rel="stylesheet">

<style>

body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  font-family:'Oswald', sans-serif;
  text-align:center;
  overflow:hidden;
  background:#f6f6f8;
}

/* GRID */
body::before{
  content:'';
  position:absolute;
  inset:0;
  background:
    linear-gradient(rgba(0,0,0,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,0,0,0.04) 1px, transparent 1px),
    linear-gradient(rgba(0,0,0,0.015) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,0,0,0.015) 1px, transparent 1px);

  background-size:
    140px 140px,
    140px 140px,
    28px 28px,
    28px 28px;

  z-index:0;
}

/* BACK */
.back{
  position:fixed;
  top:18px;
  left:18px;
  font-size:28px;
  cursor:pointer;
  opacity:0.7;
  z-index:10;
  user-select:none;
}

.back:hover{
  opacity:1;
}

/* LOGO */
.logo{
  width:360px;
  height:360px;
  background:url('icon-512.png') no-repeat center/contain;
  z-index:2;
}

/* TEXT */
h1{
  font-size:72px;
  margin:0;
  font-weight:700;
}

p{
  font-size:18px;
  margin:0 0 18px 0;
}

/* BUTTON */
button{
  padding:16px 64px;
  background:#B91F2A;
  color:#fff;
  border:none;
  border-radius:6px;
  font-size:15px;
  letter-spacing:2px;
  cursor:pointer;
}

/* FADE */
.fade-out{
  animation:fadeOut 0.3s ease forwards;
}

@keyframes fadeOut{
  to{opacity:0;}
}

</style>
</head>

<body>

<div class="back" onclick="goBack()">›</div>

<div class="logo"></div>

<h1>LIONSIGN</h1>
<p>Digital dominance system</p>

<button onclick="enter()">ENTER</button>

<script>

/* ========================= */
/* TVOJ GLAVNI SAJT (INDEX)  */
/* ========================= */
const SITE_URL = "index.html"; 
// ako je online domen → stavi npr:
// const SITE_URL = "https://tvojdomen.com";

/* ENTER */
function enter(){
  document.body.classList.add("fade-out");

  setTimeout(()=>{
    window.location.href = SITE_URL;
  },300);
}

/* BACK */
function goBack(){

  document.body.classList.add("fade-out");

  setTimeout(()=>{

    if (window.history.length > 1){
      window.history.back();
    } else {
      window.location.href = SITE_URL;
    }

  },200);
}

</script>

</body>
</html>
