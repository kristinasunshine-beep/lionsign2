<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LIONSIGN</title>

<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&display=swap" rel="stylesheet">

<style>

body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  font-family:'Oswald', sans-serif;
  text-align:center;
  overflow:hidden;
  background:#f6f6f8;
}

/* GRID CLEAN */
body::before{
  content:'';
  position:absolute;
  inset:0;
  background:
    linear-gradient(rgba(0,0,0,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,0,0,0.04) 1px, transparent 1px),
    linear-gradient(rgba(0,0,0,0.015) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,0,0,0.015) 1px, transparent 1px);

  background-size:
    140px 140px,
    140px 140px,
    28px 28px,
    28px 28px;

  z-index:0;
  pointer-events:none;
}

/* BACK BUTTON */
.back{
  position:fixed;
  top:18px;
  left:18px;
  font-size:28px;
  cursor:pointer;
  opacity:0.7;
  z-index:10;
}

/* LOGO */
.logo{
  width:360px;
  height:360px;
  background:url('icon-512.png') no-repeat center/contain;
}

/* TEXT */
h1{
  font-size:72px;
  margin:0;
}

p{
  font-size:18px;
  margin:0 0 18px 0;
}

/* BUTTON */
button{
  padding:16px 64px;
  background:#B91F2A;
  color:#fff;
  border:none;
  border-radius:6px;
  cursor:pointer;
}

/* FADE */
.fade-out{
  animation:fadeOut 0.3s ease forwards;
}

@keyframes fadeOut{
  to{opacity:0;}
}

</style>
</head>

<body>

<div class="back" onclick="goBack()">›</div>

<div class="logo"></div>

<h1>LIONSIGN</h1>
<p>Digital dominance system</p>

<button onclick="enter()">ENTER</button>

<script>

/* ENTER → ostaje isto */
function enter(){
  document.body.classList.add("fade-out");

  setTimeout(()=>{
    sessionStorage.setItem("lionsign", "app");
    location.reload();
  },300);
}

/* BACK → JEDINI FIX (ovo je bilo pokvareno) */
function goBack(){

  document.body.classList.add("fade-out");

  setTimeout(()=>{

    sessionStorage.removeItem("lionsign");

    // vrati početno stanje bez praznog ekrana
    location.reload();

  },200);
}

/* STATE RESTORE */
(function(){
  const state = sessionStorage.getItem("lionsign");

  // ako si u app modu → samo promeni sadržaj, ne pravi novi ekran
  if(state === "app"){
    document.querySelector("h1").innerText = "APP";
    document.querySelector("p").innerText = "Digital dominance system (inside)";
  }
})();

</script>

</body>
</html>
