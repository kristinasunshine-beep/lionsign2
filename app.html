<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LIONSIGN</title>

<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600&display=swap" rel="stylesheet">

<style>

body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  font-family:'Oswald', sans-serif;
  text-align:center;
  overflow:hidden;

  background:#f6f6f8;
  opacity:0;
  animation:fadeIn 0.6s ease forwards;
}

/* GRID BACKGROUND */
body::before{
  content:'';
  position:absolute;
  inset:0;
  background:
    linear-gradient(rgba(0,0,0,0.06) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,0,0,0.06) 1px, transparent 1px),
    linear-gradient(rgba(0,0,0,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,0,0,0.03) 1px, transparent 1px);
  background-size:80px 80px,80px 80px,20px 20px,20px 20px;
}

/* LOGO DUO */
.logo-wrap{
  position:relative;
  margin-bottom:20px;
}

.logo{
  width:360px; /* POVECANO */
  height:360px;
  background:url('icon-512.png') no-repeat center/contain;
  position:relative;
  z-index:2;
}

.logo.clone{
  position:absolute;
  top:0;
  left:0;
  transform:scale(1.15);
  opacity:0.15;
}

/* NASLOV */
h1{
  font-size:42px;
  letter-spacing:0.5px;
  margin-bottom:4px;
}

/* PODNASLOV */
p{
  font-size:18px;
  margin-bottom:30px;
}

/* DUGME */
button{
  padding:16px 36px;
  border:none;
  background:#B91F2A;
  color:#fff;
  font-size:14px;
  letter-spacing:2px;
  cursor:pointer;
  border-radius:4px;
  transition:0.3s;
}

button:active{
  transform:scale(0.95);
}

/* FADE ANIMACIJE */
@keyframes fadeIn{
  to{opacity:1;}
}

.fade-out{
  animation:fadeOut 0.4s ease forwards;
}

@keyframes fadeOut{
  to{opacity:0;}
}

</style>
</head>

<body>

<div class="logo-wrap">
  <div class="logo clone"></div>
  <div class="logo"></div>
</div>

<h1>LIONSIGN</h1>
<p>Digital dominance system</p>

<button onclick="enterApp()">ENTER</button>

<script>
function enterApp(){
  document.body.classList.add("fade-out");
  setTimeout(()=>{
    window.location.href = "index.html";
  }, 400);
}
</script>

</body>
</html>
