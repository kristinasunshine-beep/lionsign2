<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LIONSIGN</title>

<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&display=swap" rel="stylesheet">

<style>

body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  font-family:'Oswald', sans-serif;
  text-align:center;
  overflow:hidden;
  background:#f6f6f8;
}

/* GRID */
body::before{
  content:'';
  position:absolute;
  inset:0;
  background:
    linear-gradient(rgba(0,0,0,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,0,0,0.04) 1px, transparent 1px),
    linear-gradient(rgba(0,0,0,0.015) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,0,0,0.015) 1px, transparent 1px);

  background-size:140px 140px,140px 140px,28px 28px,28px 28px;
  z-index:0;
  pointer-events:none;
}

/* ONBOARDING */
#onboarding{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  z-index:2;
}

/* SAJT */
#app{
  display:none;
  z-index:2;
}

/* LOGO */
.logo{
  width:360px;
  height:360px;
  background:url('icon-512.png') no-repeat center/contain;
}

/* TEXT */
h1{
  font-size:72px;
  margin:0;
}

p{
  font-size:18px;
  margin:0 0 18px 0;
}

/* BUTTON */
button{
  padding:16px 64px;
  background:#B91F2A;
  color:#fff;
  border:none;
  border-radius:6px;
  cursor:pointer;
}

/* APP MODE */
.app #onboarding{
  display:none;
}

.app #app{
  display:block;
}

</style>
</head>

<body>

<!-- ONBOARDING -->
<div id="onboarding">

  <div class="logo"></div>
  <h1>LIONSIGN</h1>
  <p>Digital dominance system</p>

  <button onclick="enter()">ENTER</button>

</div>

<!-- TVOJ SAJT IDE OVDE -->
<div id="app">

  <h1>LIONSIGN SAJT</h1>

</div>

<script>

/* ENTER → ulazak u SAJT + history push (mobile back radi) */
function enter(){
  document.body.classList.add("app");

  // ključ za mobilni back gesture
  history.pushState({page:"app"}, "", "#app");
}

/* mobile BACK / swipe / browser back */
window.addEventListener("popstate", function(){
  document.body.classList.remove("app");
});

</script>

</body>
</html>
