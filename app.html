<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LIONSIGN</title>

<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&display=swap" rel="stylesheet">

<style>

body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  font-family:'Oswald', sans-serif;
  text-align:center;
  background:#f6f6f8;
  overflow:hidden;
}

/* ================= GRID (KOCKA U KOCKI) ================= */
body::before{
  content:'';
  position:absolute;
  inset:0;
  background:
    linear-gradient(rgba(0,0,0,0.06) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,0,0,0.06) 1px, transparent 1px),
    linear-gradient(rgba(0,0,0,0.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,0,0,0.025) 1px, transparent 1px);

  background-size:
    120px 120px,
    120px 120px,
    24px 24px,
    24px 24px;

  z-index:0;
  animation:gridMove 18s linear infinite;
}

@keyframes gridMove{
  0%{transform:translateY(0);}
  100%{transform:translateY(-120px);}
}

/* CONTENT */
.logo{
  width:340px;
  height:340px;
  background:url('icon-512.png') no-repeat center/contain;
  z-index:2;
  animation:float 6s ease-in-out infinite;
}

@keyframes float{
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(-10px);}
}

h1{
  font-size:64px;
  margin:10px 0 0 0;
  letter-spacing:-1px;
}

p{
  font-size:18px;
  margin:0 0 25px 0;
  opacity:0.8;
}

/* ================= ENTER BUTTON ================= */
a.button{
  display:inline-block;
  padding:16px 64px;
  background:#B91F2A;
  color:#fff;
  text-decoration:none;
  border-radius:8px;
  font-size:15px;
  letter-spacing:2px;

  position:relative;
  overflow:hidden;

  transition:transform .2s ease, box-shadow .4s ease;
}

/* APPLE STYLE HOVER */
a.button:hover{
  transform:scale(1.03);
  box-shadow:0 20px 60px rgba(185,31,42,0.35);
}

/* LIGHT SWEEP EFFECT */
a.button::after{
  content:'';
  position:absolute;
  top:0;
  left:-150%;
  width:120%;
  height:100%;
  background:linear-gradient(120deg, transparent, rgba(255,255,255,0.4), transparent);
  transform:skewX(-20deg);
}

a.button:hover::after{
  animation:sweep 1.2s ease;
}

@keyframes sweep{
  0%{left:-150%;}
  100%{left:150%;}
}

/* CLICK MICRO-ANIMATION (APPLE FEEL) */
a.button:active{
  transform:scale(0.97);
}

</style>
</head>

<body>

<div class="logo"></div>

<h1>LIONSIGN</h1>
<p>Digital dominance system</p>

<!-- STABILAN LINK -->
<a class="button" href="index.html">ENTER</a>

</body>
</html>
