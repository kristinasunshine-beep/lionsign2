<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LIONSIGN</title>

<style>

body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  font-family:Arial;
  background:#f6f6f8;
  overflow:hidden;
}

/* SCREENS */
.screen{
  display:none;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}

.active{
  display:flex;
}

/* BACK */
.back{
  position:fixed;
  top:15px;
  left:15px;
  font-size:28px;
  cursor:pointer;
}

/* LOGO */
.logo{
  width:320px;
  height:320px;
  background:url('icon-512.png') no-repeat center/contain;
}

/* BUTTON */
button{
  padding:16px 60px;
  background:#B91F2A;
  color:#fff;
  border:none;
  cursor:pointer;
}

/* TEXT */
h1{
  font-size:72px;
  margin:0;
}

</style>
</head>

<body>

<div class="back" onclick="goBack()">›</div>

<!-- ONBOARDING -->
<div id="onboarding" class="screen active">
  <div class="logo"></div>
  <h1>LIONSIGN</h1>
  <button onclick="goHome()">ENTER</button>
</div>

<!-- HOME -->
<div id="home" class="screen">
  <h1>HOME</h1>
</div>

<script>

/* SWITCH */
function show(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

/* ENTER */
function goHome(){
  show('home');
}

/* BACK */
function goBack(){

  const home = document.getElementById('home').classList.contains('active');

  if(home){
    show('onboarding');
  } else {
    show('onboarding');
  }

}

</script>

</body>
</html>
