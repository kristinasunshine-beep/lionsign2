<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LIONSIGN</title>

<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&display=swap" rel="stylesheet">

<style>

body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  font-family:'Oswald', sans-serif;
  text-align:center;
  overflow:hidden;
  background:#f6f6f8;
}

/* GRID CLEAN */
body::before{
  content:'';
  position:absolute;
  inset:0;
  background:
    linear-gradient(rgba(0,0,0,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,0,0,0.04) 1px, transparent 1px),
    linear-gradient(rgba(0,0,0,0.015) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,0,0,0.015) 1px, transparent 1px);

  background-size:
    140px 140px,
    140px 140px,
    28px 28px,
    28px 28px;

  z-index:0;
  pointer-events:none;
}

/* BACK BUTTON */
.back{
  position:fixed;
  top:18px;
  left:18px;
  font-size:28px;
  cursor:pointer;
  opacity:0.7;
  z-index:10;
}

.back:hover{
  opacity:1;
}

/* LOGO */
.logo{
  width:360px;
  height:360px;
  background:url('icon-512.png') no-repeat center/contain;
  z-index:2;
}

/* TEXT */
h1{
  font-size:72px;
  margin:0;
  letter-spacing:-1px;
}

p{
  font-size:18px;
  margin:0 0 18px 0;
  font-weight:300;
}

/* BUTTON */
button{
  padding:16px 64px;
  background:#B91F2A;
  color:#fff;
  border:none;
  border-radius:6px;
  font-size:15px;
  letter-spacing:2px;
  cursor:pointer;
}

/* CARDS */
.cards{
  display:none;
  gap:10px;
  margin-top:20px;
}

.card{
  width:120px;
  height:80px;
  border:1px solid rgba(0,0,0,0.2);
  display:flex;
  justify-content:center;
  align-items:center;
  cursor:pointer;
  font-size:14px;
}

/* VIEWS */
.view{
  display:none;
  z-index:2;
}

.active{
  display:flex;
  flex-direction:column;
  align-items:center;
}

/* FADE */
.fade{
  animation:fade 0.3s ease;
}

@keyframes fade{
  from{opacity:0;}
  to{opacity:1;}
}

</style>
</head>

<body>

<div class="back" onclick="goBack()">›</div>

<!-- ONBOARDING -->
<div id="onboarding" class="view active">
  <div class="logo"></div>
  <h1>LIONSIGN</h1>
  <p>Digital dominance system</p>
  <button onclick="enterApp()">ENTER</button>
</div>

<!-- HOME -->
<div id="home" class="view">
  <h1>HOME</h1>
  <div class="cards">
    <div class="card" onclick="openCard(1)">1</div>
    <div class="card" onclick="openCard(2)">2</div>
    <div class="card" onclick="openCard(3)">3</div>
  </div>
</div>

<!-- CARD VIEW -->
<div id="cardView" class="view">
  <h1 id="cardTitle"></h1>
  <p>Card content here</p>
</div>

<script>

let historyStack = [];

/* VIEW SWITCH */
function show(view){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById(view).classList.add('active');
}

/* ENTER */
function enterApp(){
  historyStack.push("onboarding");
  historyStack.push("home");
  show("home");
}

/* OPEN CARD */
function openCard(id){
  historyStack.push("home");
  historyStack.push("card"+id);

  document.getElementById("cardTitle").innerText = "CARD " + id;
  show("cardView");
}

/* BACK SYSTEM (KLJUČ) */
function goBack(){

  if(historyStack.length <= 1){
    show("onboarding");
    historyStack = [];
    return;
  }

  historyStack.pop();
  let prev = historyStack.pop();

  if(prev === "home"){
    show("home");
  } 
  else if(prev === "onboarding"){
    show("onboarding");
  }
  else if(prev && prev.startsWith("card")){
    let id = prev.replace("card","");
    document.getElementById("cardTitle").innerText = "CARD " + id;
    show("cardView");
  }
  else{
    show("onboarding");
  }
}

</script>

</body>
</html>
