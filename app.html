<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LIONSIGN</title>

<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&display=swap" rel="stylesheet">

<style>

body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  font-family:'Oswald', sans-serif;
  text-align:center;
  background:#f6f6f8;
  overflow:hidden;
}

/* GRID (NE MENJAMO) */
body::before{
  content:'';
  position:absolute;
  inset:0;
  background:
    linear-gradient(rgba(0,0,0,0.06) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,0,0,0.06) 1px, transparent 1px),
    linear-gradient(rgba(0,0,0,0.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,0,0,0.025) 1px, transparent 1px);

  background-size:120px 120px,120px 120px,24px 24px,24px 24px;
  z-index:0;
  animation:gridMove 18s linear infinite;
}

@keyframes gridMove{
  0%{transform:translateY(0);}
  100%{transform:translateY(-120px);}
}

/* CONTENT */
.logo{
  width:340px;
  height:340px;
  background:url('icon-512.png') no-repeat center/contain;
  animation:float 6s ease-in-out infinite;
}

@keyframes float{
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(-10px);}
}

h1{
  font-size:64px;
  margin:10px 0 0 0;
}

p{
  font-size:18px;
  margin:0 0 25px 0;
  opacity:0.8;
}

/* ================= ENTER BUTTON ================= */
a.button{
  display:inline-block;
  padding:16px 64px;
  background:#B91F2A;
  color:#fff;
  text-decoration:none;
  border-radius:8px;
  font-size:15px;
  letter-spacing:2px;

  position:relative;
  overflow:hidden;

  /* osnovni shadow (bez glow-a) */
  box-shadow:0 8px 0 rgba(0,0,0,0.08);

  transition:
    transform 0.18s ease,
    box-shadow 0.18s ease,
    filter 0.18s ease;
}

/* HOVER — minimalni lift */
a.button:hover{
  transform:translateY(-2px);
  filter:brightness(1.03);
}

/* ACTIVE — “real press” efekat */
a.button:active{
  transform:translateY(3px) scale(0.98);
  box-shadow:0 2px 0 rgba(0,0,0,0.08);
  filter:brightness(0.98);
}

/* SOFT MICRO SHIMMER (NE GLARE, SAMO POKRET SVETLA) */
a.button::after{
  content:'';
  position:absolute;
  top:0;
  left:-120%;
  width:120%;
  height:100%;
  background:linear-gradient(120deg, transparent, rgba(255,255,255,0.12), transparent);
  transform:skewX(-20deg);
}

a.button:hover::after{
  animation:shine 1s ease;
}

@keyframes shine{
  0%{left:-120%;}
  100%{left:120%;}
}

</style>
</head>

<body>

<div class="logo"></div>

<h1>LIONSIGN</h1>
<p>Digital dominance system</p>

<a class="button" href="index.html">ENTER</a>

</body>
</html>
