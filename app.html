<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LIONSIGN</title>

<style>

body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  font-family: 'Barlow Condensed', sans-serif;

  /* SKUPO IZGLED — TAMNI ŠAMPANJAC */
  background: linear-gradient(135deg, #eae7df 0%, #d6c6a5 40%, #c6a75e 100%);
  color:#111;
  text-align:center;
  overflow:hidden;
}

/* SHIMMER OVERLAY */
body::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(120deg, transparent 40%, rgba(255,255,255,0.25) 50%, transparent 60%);
  animation:shimmer 4s infinite;
}

@keyframes shimmer{
  0%{transform:translateX(-100%);}
  100%{transform:translateX(100%);}
}

/* LOGO */
.logo{
  width:200px; /* +40% */
  height:200px;
  background:url('icon-512.png') no-repeat center/contain;
  margin-bottom:20px;
  opacity:0;
  transform:scale(0.9);
  animation:fadeScale 1s ease forwards;
}

/* NASLOV */
h1{
  font-size:28px;
  letter-spacing:1px; /* kondenzovano */
  margin-bottom:4px;
  opacity:0;
  animation:fadeUp 1s ease forwards;
  animation-delay:0.3s;
}

/* PODNASLOV */
p{
  font-size:13px;
  opacity:0.7;
  margin-bottom:30px;
  opacity:0;
  animation:fadeUp 1s ease forwards;
  animation-delay:0.5s;
}

/* DUGME */
button{
  padding:14px 32px;
  border:none;
  background:#111;
  color:#fff;
  font-size:13px;
  letter-spacing:2px;
  cursor:pointer;
  border-radius:6px;
  position:relative;
  overflow:hidden;
  transition:0.3s;
  opacity:0;
  animation:fadeUp 1s ease forwards;
  animation-delay:0.7s;
}

/* GOLD HOVER */
button:hover{
  background:#B91F2A;
}

/* TAP RIPPLE */
button::after{
  content:"";
  position:absolute;
  width:10px;
  height:10px;
  background:rgba(255,255,255,0.4);
  border-radius:50%;
  transform:scale(0);
  opacity:0;
}

button:active::after{
  transform:scale(12);
  opacity:1;
  transition:0.4s;
}

/* ANIMACIJE */
@keyframes fadeUp{
  to{
    opacity:1;
    transform:translateY(0);
  }
}

@keyframes fadeScale{
  to{
    opacity:1;
    transform:scale(1);
  }
}

</style>
</head>

<body>

<div class="logo"></div>

<h1>LIONSIGN</h1>
<p>Digital dominance system</p>

<button onclick="enterApp()">ENTER</button>

<script>
function enterApp(){
  document.body.style.opacity = "0";
  setTimeout(()=>{
    window.location.href = "index.html";
  }, 300);
}
</script>

</body>
</html>
