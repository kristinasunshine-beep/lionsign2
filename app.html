<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LIONSIGN</title>

<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&display=swap" rel="stylesheet">

<style>

body{
  margin:0;
  height:100vh;
  font-family:'Oswald', sans-serif;
  background:#f6f6f8;
  overflow:hidden;
}

/* GRID */
body::before{
  content:'';
  position:absolute;
  inset:0;
  background:
    linear-gradient(rgba(0,0,0,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,0,0,0.04) 1px, transparent 1px),
    linear-gradient(rgba(0,0,0,0.015) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,0,0,0.015) 1px, transparent 1px);

  background-size:140px 140px,140px 140px,28px 28px,28px 28px;
  z-index:0;
  pointer-events:none;
}

/* BACK */
.back{
  position:fixed;
  top:18px;
  left:18px;
  font-size:28px;
  cursor:pointer;
  opacity:0.7;
  z-index:10;
}

/* ONBOARDING */
#onboarding{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  z-index:2;
}

.logo{
  width:360px;
  height:360px;
  background:url('icon-512.png') no-repeat center/contain;
}

h1{
  font-size:72px;
  margin:0;
}

p{
  font-size:18px;
  margin:0 0 18px 0;
}

button{
  padding:16px 64px;
  background:#B91F2A;
  color:#fff;
  border:none;
  cursor:pointer;
  border-radius:6px;
}

/* TVOJ SAJT (LAYOUT ISPOD ONBOARDINGA) */
#app{
  display:none;
  position:absolute;
  inset:0;
  z-index:1;
  padding-top:80px;
  text-align:center;
}

/* OVDE OSTAVLJAŠ TVOJ ORIGINALNI SAJT */
</style>
</head>

<body>

<div class="back" onclick="goBack()">›</div>

<!-- ONBOARDING -->
<div id="onboarding">

  <div class="logo"></div>
  <h1>LIONSIGN</h1>
  <p>Digital dominance system</p>

  <button onclick="enter()">ENTER</button>

</div>

<!-- TVOJ REALAN SAJT IDE OVDE -->
<div id="app">

  <!-- 👇 OVDE NE DIRAM TVOJ LAYOUT -->
  <h1>LIONSIGN SAJT</h1>

</div>

<script>

/* ENTER → prikazuje sajt */
function enter(){
  document.getElementById('onboarding').style.display = 'none';
  document.getElementById('app').style.display = 'block';
}

/* BACK → vraća onboarding */
function goBack(){
  document.getElementById('app').style.display = 'none';
  document.getElementById('onboarding').style.display = 'flex';
}

</script>

</body>
</html>
