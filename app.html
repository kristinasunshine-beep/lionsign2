<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LIONSIGN</title>

<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&display=swap" rel="stylesheet">

<style>

body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  font-family:'Oswald', sans-serif;
  text-align:center;
  background:#f6f6f8;
  overflow:hidden;
}

/* GRID (NE DIRAMO) */
body::before{
  content:'';
  position:absolute;
  inset:0;
  background:
    linear-gradient(rgba(0,0,0,0.06) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,0,0,0.06) 1px, transparent 1px),
    linear-gradient(rgba(0,0,0,0.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,0,0,0.025) 1px, transparent 1px);

  background-size:120px 120px,120px 120px,24px 24px,24px 24px;
  z-index:0;
  animation:gridMove 18s linear infinite;
}

@keyframes gridMove{
  0%{transform:translateY(0);}
  100%{transform:translateY(-120px);}
}

/* CONTENT */
.logo{
  width:340px;
  height:340px;
  background:url('icon-512.png') no-repeat center/contain;
  animation:float 6s ease-in-out infinite;
}

@keyframes float{
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(-10px);}
}

h1{
  font-size:64px;
  margin:10px 0 0 0;
}

p{
  font-size:18px;
  margin:0 0 25px 0;
  opacity:0.8;
}

/* ================= ENTER BUTTON ================= */
a.button{
  display:inline-block;
  padding:16px 64px;
  background:#B91F2A; /* OSTAVLJENO ISTO */
  color:#fff;
  text-decoration:none;
  border-radius:8px;
  font-size:15px;
  letter-spacing:2px;

  position:relative;
  overflow:hidden;

  transition:transform 0.15s ease;
}

/* HOVER — lagani “anticipation” */
a.button:hover{
  transform:translateY(-2px);
}

/* ================= DRAMATIC CLICK ================= */
a.button:active{
  animation:buttonSnap 0.42s cubic-bezier(.2,.9,.2,1) both;
}

/* SNAP + ELASTIC RETURN */
@keyframes buttonSnap{

  0%{
    transform:scale(1);
  }

  30%{
    transform:scale(0.86);
  }

  55%{
    transform:scale(1.08);
  }

  75%{
    transform:scale(0.96);
  }

  100%{
    transform:scale(1);
  }
}

</style>
</head>

<body>

<div class="logo"></div>

<h1>LIONSIGN</h1>
<p>Digital dominance system</p>

<a class="button" href="index.html">ENTER</a>

</body>
</html>
