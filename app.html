<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LIONSIGN</title>

<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&display=swap" rel="stylesheet">

<style>

body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:'Oswald', sans-serif;
  background:#f6f6f8;
  overflow:hidden;
}

/* BACK */
.back{
  position:fixed;
  top:15px;
  left:15px;
  font-size:28px;
  cursor:pointer;
  opacity:0.7;
  z-index:10;
}

/* SCREENS */
.screen{
  display:none;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
}

.active{
  display:flex;
}

/* LOGO */
.logo{
  width:340px;
  height:340px;
  background:url('icon-512.png') no-repeat center/contain;
}

/* TEXT */
h1{
  font-size:72px;
  margin:0;
}

p{
  font-size:18px;
  margin:0 0 18px 0;
}

/* BUTTON */
button{
  padding:16px 60px;
  background:#B91F2A;
  color:#fff;
  border:none;
  cursor:pointer;
  border-radius:6px;
}

</style>
</head>

<body>

<div class="back" onclick="goBack()">›</div>

<!-- ONBOARDING -->
<div id="onboarding" class="screen active">
  <div class="logo"></div>
  <h1>LIONSIGN</h1>
  <p>Digital dominance system</p>
  <button onclick="enter()">ENTER</button>
</div>

<!-- APP -->
<div id="app" class="screen">
  <h1>APP</h1>
  <p>Welcome inside</p>
</div>

<script>

function show(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function enter(){
  show('app');
}

function goBack(){
  show('onboarding');
}

</script>

</body>
</html>
