<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LIONSIGN</title>

<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&display=swap" rel="stylesheet">

<style>

body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  font-family:'Oswald', sans-serif;
  text-align:center;
  overflow:hidden;
  background:#f6f6f8;
}

/* GRID */
body::before{
  content:'';
  position:absolute;
  inset:0;
  background:
    linear-gradient(rgba(0,0,0,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,0,0,0.04) 1px, transparent 1px),
    linear-gradient(rgba(0,0,0,0.015) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,0,0,0.015) 1px, transparent 1px);

  background-size:
    140px 140px,
    140px 140px,
    28px 28px,
    28px 28px;

  z-index:0;
  pointer-events:none;
}

/* BACK */
.back{
  position:fixed;
  top:18px;
  left:18px;
  font-size:28px;
  cursor:pointer;
  opacity:0.7;
  z-index:10;
}

/* SCREEN SYSTEM */
.screen{
  display:none;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  z-index:2;
}

.active{
  display:flex;
}

/* LOGO */
.logo{
  width:360px;
  height:360px;
  background:url('icon-512.png') no-repeat center/contain;
}

/* TEXT */
h1{
  font-size:72px;
  margin:0;
}

p{
  font-size:18px;
  margin:0 0 18px 0;
}

/* BUTTON */
button{
  padding:16px 64px;
  background:#B91F2A;
  color:#fff;
  border:none;
  border-radius:6px;
  cursor:pointer;
}

</style>
</head>

<body>

<div class="back" onclick="goBack()">›</div>

<!-- ONBOARDING -->
<div id="onboarding" class="screen active">

  <div class="logo"></div>
  <h1>LIONSIGN</h1>
  <p>Digital dominance system</p>

  <button onclick="enterApp()">ENTER</button>

</div>

<!-- SAJT (APP) -->
<div id="app" class="screen">

  <h1>LIONSIGN</h1>
  <p>Your website content goes here</p>

</div>

<script>

/* SWITCH SYSTEM */
function show(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

/* ENTER → SAJT */
function enterApp(){
  show('app');
}

/* BACK → ONBOARDING */
function goBack(){
  show('onboarding');
}

</script>

</body>
</html>
