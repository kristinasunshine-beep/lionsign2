<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LIONSIGN</title>

<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&display=swap" rel="stylesheet">

<style>

body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  font-family:'Oswald', sans-serif;
  text-align:center;
  overflow:hidden;

  background:#f6f6f8;
  opacity:0;
  animation:fadeIn 0.6s ease forwards;

  transform: translateY(-28px);
}

/* CLEAN GRID (UKLONJENE PRLJAVE TAČKE) */
body::before{
  content:'';
  position:absolute;
  inset:0;
  background:
    linear-gradient(rgba(0,0,0,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,0,0,0.04) 1px, transparent 1px),
    linear-gradient(rgba(0,0,0,0.015) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,0,0,0.015) 1px, transparent 1px);

  background-size:
    140px 140px,
    140px 140px,
    28px 28px,
    28px 28px;

  z-index:0;
  pointer-events:none;
}

/* LOGO */
.logo-wrap{
  margin-bottom:0px;
  z-index:2;
}

.logo{
  width:360px;
  height:360px;
  background:url('icon-512.png') no-repeat center/contain;
  filter:none;
}

/* OPTIČKO CENTRIRANJE */
.content{
  margin-top:-60px;
  z-index:2;
  position:relative;
}

/* 🔽 NASLOV (MANJI + TIGHTER TRACKING) */
h1{
  font-size:68px;
  font-weight:700;
  margin:0;
  letter-spacing:-1px; /* TIGHT */
}

/* PODNASLOV */
p{
  font-size:18px;
  margin:0;
  margin-bottom:18px;
  font-weight:300;
}

/* 🔴 ENTER VEĆI */
button{
  padding:16px 66px;
  border:none;
  background:#B91F2A;
  color:#fff;
  font-size:15px;
  letter-spacing:2px;
  cursor:pointer;
  border-radius:6px;
  transition:0.2s ease;

  position:relative;
  z-index:3;
}

button:hover{
  transform:scale(1.06);
}

button:active{
  transform:scale(0.96);
}

/* FADE */
@keyframes fadeIn{
  to{opacity:1;}
}

.fade-out{
  animation:fadeOut 0.4s ease forwards;
}

@keyframes fadeOut{
  to{opacity:0;}
}

/* BACK LINK (REAL SYSTEM FIX) */
.back{
  position:absolute;
  top:18px;
  left:18px;
  font-size:12px;
  opacity:0.6;
  cursor:pointer;
  z-index:5;
}

</style>
</head>

<body>

<div class="back" onclick="goBack()">← back</div>

<div class="logo-wrap">
  <div class="logo"></div>
</div>

<div class="content">
  <h1>LIONSIGN</h1>
  <p>Digital dominance system</p>
  <button onclick="enterApp()">ENTER</button>
</div>

<script>

/* ENTER → SITE */
function enterApp(){
  sessionStorage.setItem("lionsign_state", "site");

  document.body.classList.add("fade-out");

  setTimeout(() => {
    window.location.href = "index.html";
  }, 350);
}

/* BACK → ONBOARDING */
function goBack(){
  sessionStorage.setItem("lionsign_state", "onboarding");

  document.body.classList.add("fade-out");

  setTimeout(() => {
    window.location.href = "onboarding.html";
  }, 300);
}

/* SAFE LOAD (sprečava prazan ekran posle install / refresh) */
window.onload = () => {
  document.body.style.opacity = "1";
};

</script>

</body>
</html>
