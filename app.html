<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LIONSIGN</title>

<style>

body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  font-family: 'Arial', sans-serif;

  /* PRLJAVO BELA + ZLATNI GRADIENT */
  background: linear-gradient(135deg, #f5f5f2 0%, #e8dcc0 100%);
  color:#111;
  text-align:center;
}

/* LOGO */
.logo{
  width:140px;
  height:140px;
  background:url('icon-512.png') no-repeat center/contain;
  margin-bottom:30px;
  opacity:0;
  transform:translateY(20px);
  animation:fadeIn 1s ease forwards;
}

/* NASLOV */
h1{
  font-size:32px;
  letter-spacing:2px;
  margin-bottom:10px;
  opacity:0;
  animation:fadeIn 1s ease forwards;
  animation-delay:0.3s;
}

/* PODNASLOV */
p{
  font-size:14px;
  opacity:0.7;
  margin-bottom:40px;
  opacity:0;
  animation:fadeIn 1s ease forwards;
  animation-delay:0.6s;
}

/* DUGME */
button{
  padding:14px 28px;
  border:none;
  background:#111;
  color:#fff;
  font-size:14px;
  letter-spacing:2px;
  cursor:pointer;
  border-radius:4px;
  transition:0.3s;
  opacity:0;
  animation:fadeIn 1s ease forwards;
  animation-delay:0.9s;
}

button:hover{
  background:#B91F2A;
}

/* ANIMACIJA */
@keyframes fadeIn{
  to{
    opacity:1;
    transform:translateY(0);
  }
}

</style>
</head>

<body>

<div class="logo"></div>

<h1>LIONSIGN</h1>
<p>Digital dominance system</p>

<button onclick="enterApp()">ENTER</button>

<script>
function enterApp(){
  window.location.href = "index.html";
}
</script>

</body>
</html>
