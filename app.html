<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LIONSIGN</title>

<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&display=swap" rel="stylesheet">

<style>

body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  font-family:'Oswald', sans-serif;
  text-align:center;
  background:#f6f6f8;
  overflow:hidden;
}

/* GRID (ostaje isto) */
body::before{
  content:'';
  position:absolute;
  inset:0;
  background:
    linear-gradient(rgba(0,0,0,0.06) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,0,0,0.06) 1px, transparent 1px),
    linear-gradient(rgba(0,0,0,0.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,0,0,0.025) 1px, transparent 1px);

  background-size:120px 120px,120px 120px,24px 24px,24px 24px;
  z-index:0;
  animation:gridMove 18s linear infinite;
}

@keyframes gridMove{
  0%{transform:translateY(0);}
  100%{transform:translateY(-120px);}
}

/* CONTENT */
.logo{
  width:340px;
  height:340px;
  background:url('icon-512.png') no-repeat center/contain;
  animation:float 6s ease-in-out infinite;
}

@keyframes float{
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(-10px);}
}

h1{
  font-size:64px;
  margin:10px 0 0 0;
}

p{
  font-size:18px;
  margin:0 0 25px 0;
  opacity:0.8;
}

/* ================= GLASS BUTTON ================= */
a.button{
  display:inline-block;
  padding:16px 64px;
  text-decoration:none;
  font-size:15px;
  letter-spacing:2px;
  color:#fff;
  border-radius:10px;

  /* GLASS EFFECT */
  background:rgba(185,31,42,0.55);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);

  border:1px solid rgba(255,255,255,0.25);

  position:relative;
  overflow:hidden;

  transition:transform .25s ease, background .25s ease;
}

/* SOFT LIGHT REFLECTION (NO GLOW) */
a.button::before{
  content:'';
  position:absolute;
  top:-50%;
  left:-60%;
  width:200%;
  height:200%;
  background:linear-gradient(120deg, transparent, rgba(255,255,255,0.18), transparent);
  transform:rotate(20deg);
  transition:all 0.8s ease;
}

a.button:hover::before{
  left:120%;
}

/* HOVER DEPTH */
a.button:hover{
  transform:translateY(-2px) scale(1.02);
  background:rgba(185,31,42,0.7);
}

/* PRESS FEEL */
a.button:active{
  transform:scale(0.97);
  background:rgba(185,31,42,0.5);
}

</style>
</head>

<body>

<div class="logo"></div>

<h1>LIONSIGN</h1>
<p>Digital dominance system</p>

<!-- STABILAN LINK -->
<a class="button" href="index.html">ENTER</a>

</body>
</html>
