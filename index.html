<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LIONSIGN</title>

<meta name="description" content="LIONSIGN Studio creates branding systems and spatial identities.">
<meta name="keywords" content="branding, doberman branding, digital design, landscape design, visual identity">

<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

/* RESET */
*{margin:0;padding:0;box-sizing:border-box;}

body{
  background:#f6f6f8;
  color:#1d1d1f;
  font-family:'Barlow Condensed', sans-serif;
  overflow-x:hidden;
  cursor:none;
}

/* GRID */
body::before{
  content:'';
  position:fixed;
  inset:0;
  background:
    linear-gradient(rgba(0,0,0,0.06) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,0,0,0.06) 1px, transparent 1px),
    linear-gradient(rgba(0,0,0,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,0,0,0.03) 1px, transparent 1px);
  background-size:80px 80px,80px 80px,20px 20px,20px 20px;
  z-index:0;
  pointer-events:none;
}

body > *{position:relative;z-index:1;}

/* CUSTOM CURSOR */
#cursor{
  width:18px;
  height:18px;
  border:2px solid #B91F2A;
  border-radius:50%;
  position:fixed;
  top:0;
  left:0;
  pointer-events:none;
  transform:translate(-50%,-50%);
  transition:width .2s ease, height .2s ease, background .2s ease;
  z-index:99999;
}

#cursor.active{
  width:50px;
  height:50px;
  background:rgba(185,31,42,0.12);
}

/* NAV */
nav{
  position:fixed;
  width:100%;
  padding:20px 80px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:#C6A75E;
  z-index:9999;
}

.brand{
  font-family:'Anton';
  font-size:26px;
}

nav a{
  text-decoration:none;
  color:#000;
  font-size:22px;
}

/* HERO */
.hero{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  padding:140px 80px 60px;
}

.hero h1{
  font-family:'Anton';
  font-size:110px;
  opacity:0;
  transform:scale(1.1);
  animation:heroIn 1s ease forwards;
}

.hero span{color:#B91F2A;}

@keyframes heroIn{
  to{opacity:1; transform:scale(1);}
}

.hero p{
  font-size:30px;
  margin-top:10px;
}

.subline{
  margin-top:200px;
  font-family:'Anton';
  font-size:44px;
}

/* SERVICES */
.services{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:40px;
  padding:40px 80px;
}

/* CARDS */
.card{
  background:#fff;
  padding:36px;
  border-radius:10px;
  border:1px solid #e5e5e7;
  text-decoration:none;
  color:#000;
  transition:0.25s ease;

  opacity:0;
  transform:translateY(50px);
  animation:cardIn 0.8s ease forwards;
}

.card:nth-child(1){animation-delay:0.05s;}
.card:nth-child(2){animation-delay:0.15s;}
.card:nth-child(3){animation-delay:0.25s;}
.card:nth-child(4){animation-delay:0.35s;}

@keyframes cardIn{
  to{
    opacity:1;
    transform:translateY(0);
  }
}

.card:hover{
  transform:translateY(-10px);
  border:1px solid #B91F2A;
  box-shadow:0 25px 60px rgba(185,31,42,0.18);
}

.num{
  font-family:'Anton';
  font-size:92px;
  color:#B91F2A;
}

.card h3{
  font-family:'Anton';
  font-size:44px;
}

.card p{
  font-size:22px;
  margin-top:6px;
}

/* MANIFEST */
.manifest{
  padding:80px;
}

.manifest-title{
  font-family:'Anton';
  font-size:80px;
  margin-bottom:30px;
}

.manifest-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
}

.m-card{
  background:#fff;
  padding:20px;
  border-radius:8px;
  border:1.5px solid rgba(185,31,42,0.6);
}

/* FAQ */
.faq{
  padding:80px;
}

.faq-title{
  font-family:'Anton';
  font-size:80px;
  margin-bottom:30px;
}

.faq-item{
  background:#fff;
  border:1px solid #e5e5e7;
  border-radius:10px;
  margin-bottom:12px;
  overflow:hidden;
}

.faq-question{
  padding:22px;
  font-family:'Anton';
  font-size:24px;
  cursor:pointer;
  display:flex;
  justify-content:space-between;
}

.faq-answer{
  max-height:0;
  overflow:hidden;
  transition:max-height 0.35s ease;
  padding:0 22px;
}

.faq-item.active .faq-answer{
  max-height:200px;
}

.faq-answer p{
  font-size:20px;
  padding-bottom:20px;
  opacity:0.85;
}

/* POWER */
.power{
  padding:60px 80px;
  font-family:'Anton';
  font-size:80px;
}

.power span{color:#B91F2A;}

/* FOOTER */
.footer{
  padding:30px 80px;
}

/* MOBILE FIX - ONLY CURSOR BEHAVIOR */
@media(max-width:768px){

body{cursor:auto;}
#cursor{display:none;}

.hero{padding:120px 20px;}
.hero h1{font-size:52px;}

.services{
  grid-template-columns:1fr;
  padding:40px 20px;
}

.manifest,
.faq{
  padding:40px 20px;
}

.manifest-grid{
  grid-template-columns:1fr;
}

.power{font-size:42px;}

.hero p{font-size:18px;}

.faq-title{font-size:42px;}
}

</style>
</head>

<body>

<div id="cursor"></div>

<nav>
  <div class="brand">LIONSIGN</div>
  <a href="https://www.facebook.com/kristina.radosavljevic" target="_blank">CONTACT</a>
</nav>

<div class="hero">
  <h1><span>DESIGN</span> BUILDS DOMINANCE</h1>
  <p>We create identities, systems and spaces that command attention</p>
  <div class="subline">FOUR DISCIPLINES. ONE PHILOSOPHY.</div>
</div>

<script>
const cursor = document.getElementById("cursor");

document.addEventListener("mousemove", (e)=>{
  cursor.style.top = e.clientY + "px";
  cursor.style.left = e.clientX + "px";
});

const interactive = document.querySelectorAll("a, .card, .faq-question, nav a");

interactive.forEach(el=>{
  el.addEventListener("mouseenter", ()=> cursor.classList.add("active"));
  el.addEventListener("mouseleave", ()=> cursor.classList.remove("active"));
});
</script>

</body>
</html>
