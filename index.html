<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LIONSIGN</title>

<meta name="description" content="LIONSIGN Studio creates branding systems and spatial identities.">
<meta name="keywords" content="branding, doberman branding, digital design, landscape design, visual identity">

<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

/* RESET */
*{margin:0;padding:0;box-sizing:border-box;}

body{
  background:#f6f6f8;
  color:#1d1d1f;
  font-family:'Barlow Condensed', sans-serif;
  overflow-x:hidden;
  cursor:none;
}

body::before{
  content:'';
  position:fixed;
  inset:0;
  background:
    linear-gradient(rgba(0,0,0,0.06) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,0,0,0.06) 1px, transparent 1px),
    linear-gradient(rgba(0,0,0,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,0,0,0.03) 1px, transparent 1px);
  background-size:80px 80px,80px 80px,20px 20px,20px 20px;
  z-index:0;
  pointer-events:none;
}

body > *{position:relative;z-index:1;}

/* CURSOR */
#cursor{
  width:18px;
  height:18px;
  border:2px solid #B91F2A;
  border-radius:50%;
  position:fixed;
  top:0;
  left:0;
  pointer-events:none;
  transform:translate(-50%,-50%);
  transition:width .2s ease, height .2s ease, background .2s ease;
  z-index:99999;
}

#cursor.active{
  width:50px;
  height:50px;
  background:rgba(185,31,42,0.12);
}

/* NAV */
nav{
  position:fixed;
  width:100%;
  padding:20px 80px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:#C6A75E;
  z-index:9999;
}

.brand{
  font-family:'Anton';
  font-size:26px;
}

nav a{
  text-decoration:none;
  color:#000;
  font-size:22px;
}

/* HERO */
.hero{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  padding:140px 80px 60px;
}

.hero h1{
  font-family:'Anton';
  font-size:110px;
}

.hero span{color:#B91F2A;}

.hero p{font-size:30px;margin-top:10px;}

.subline{
  margin-top:200px;
  font-family:'Anton';
  font-size:44px;
}

/* SERVICES */
.services{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:40px;
  padding:40px 80px;
}

.card{
  background:#fff;
  padding:36px;
  border-radius:10px;
  border:1px solid #e5e5e7;
  text-decoration:none;
  color:#000;
  transition:0.25s ease;
}

.card:hover{
  transform:translateY(-10px);
  border:1px solid #B91F2A;
}

/* MANIFEST */
.manifest{padding:80px;}

.manifest-title{
  font-family:'Anton';
  font-size:80px;
}

/* FOOTER */
.footer{padding:30px 80px;}

@media(max-width:768px){
body{cursor:auto;}
#cursor{display:block;} /* VAŽNO: ne gasimo ga */

.services{grid-template-columns:1fr;padding:40px 20px;}
.hero{padding:120px 20px;}
.hero h1{font-size:52px;}
}

/* hidden cursor is only visual on mobile but still ACTIVE */
</style>
</head>

<body>

<div id="cursor"></div>

<nav>
  <div class="brand">LIONSIGN</div>
  <a href="https://www.facebook.com/kristina.radosavljevic" target="_blank">CONTACT</a>
</nav>

<div class="hero">
  <h1><span>DESIGN</span> BUILDS DOMINANCE</h1>
  <p>We create identities, systems and spaces that command attention</p>
</div>

<div class="services">

<a href="https://preview.mailerlite.io/preview/2126552/sites/186170656816104474/lionsign-research-design-tqdlog" class="card">
<h3>DOBERMAN BRANDING</h3>
</a>

<a href="https://preview.mailerlite.io/preview/2126552/sites/180110322571413099/Uysoji" class="card">
<h3>DIGITAL DESIGN</h3>
</a>

<a href="https://preview.mailerlite.io/preview/2126552/sites/186276712092272536/lionsign-research-design-1h32yv" class="card">
<h3>LANDSCAPE DESIGN</h3>
</a>

<a href="https://preview.mailerlite.io/preview/2126552/sites/180559352095048839/3N6yet" class="card">
<h3>OBSIDIAN LINE</h3>
</a>

</div>

<div class="footer">
© 2019–2026 LIONSIGN
</div>

<script>

/* CURSOR — WORKS ON DESKTOP + MOBILE TOUCH */
const cursor = document.getElementById("cursor");

let mouseX = 0, mouseY = 0;
let currentX = 0, currentY = 0;

const isTouch = window.matchMedia("(pointer: coarse)").matches;

/* desktop mouse */
document.addEventListener("mousemove", (e)=>{
  mouseX = e.clientX;
  mouseY = e.clientY;
});

/* mobile touch */
document.addEventListener("touchmove", (e)=>{
  const t = e.touches[0];
  mouseX = t.clientX;
  mouseY = t.clientY;
}, {passive:true});

/* inertial lag (Apple feel) */
function animate(){
  currentX += (mouseX - currentX) * 0.12;
  currentY += (mouseY - currentY) * 0.12;

  cursor.style.left = currentX + "px";
  cursor.style.top = currentY + "px";

  requestAnimationFrame(animate);
}
animate();

/* hover interaction (desktop + mobile tap) */
const interactive = document.querySelectorAll("a, .card, nav a");

interactive.forEach(el=>{
  el.addEventListener("mouseenter", ()=> cursor.classList.add("active"));
  el.addEventListener("mouseleave", ()=> cursor.classList.remove("active"));

  el.addEventListener("touchstart", ()=> cursor.classList.add("active"));
  el.addEventListener("touchend", ()=> cursor.classList.remove("active"));
});

</script>

</body>
</html>
