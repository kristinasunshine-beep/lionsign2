<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LIONSIGN</title>

<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

/* RESET */
*{margin:0;padding:0;box-sizing:border-box;}

body{
  background:#f6f6f8;
  color:#1d1d1f;
  font-family:'Barlow Condensed', sans-serif;
  overflow-x:hidden;
  cursor:none;
}

/* GRID - FIXED (NE BLOKIRA KLIKOVE) */
body::before{
  content:'';
  position:fixed;
  inset:0;
  background:
    linear-gradient(rgba(0,0,0,0.06) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,0,0,0.06) 1px, transparent 1px),
    linear-gradient(rgba(0,0,0,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,0,0,0.03) 1px, transparent 1px);
  background-size:80px 80px,80px 80px,20px 20px,20px 20px;
  z-index:0;
  pointer-events:none; /* 🔥 KLJUČ FIX */
}

/* CURSOR - FIXED (NE BLOKIRA KLIKOVE) */
#cursor{
  width:18px;
  height:18px;
  border:2px solid #B91F2A;
  border-radius:50%;
  position:fixed;
  top:0;
  left:0;
  pointer-events:none; /* 🔥 KLJUČ FIX */
  transform:translate(-50%,-50%);
  transition:width .2s ease, height .2s ease, background .2s ease;
  z-index:99999;
}

#cursor.active{
  width:50px;
  height:50px;
  background:rgba(185,31,42,0.12);
}

/* NAV */
nav{
  position:fixed;
  width:100%;
  padding:20px 80px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:#C6A75E;
  z-index:10;
}

.brand{
  font-family:'Anton';
  font-size:26px;
}

nav a{
  text-decoration:none;
  color:#000;
  font-size:22px;
}

/* HERO */
.hero{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  padding:140px 80px 60px;
}

/* SERVICES */
.services{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:40px;
  padding:40px 80px;
}

/* 🔥 FIX: pointer-events ensured */
.card{
  background:#fff;
  padding:36px;
  border-radius:10px;
  border:1px solid #e5e5e7;
  text-decoration:none;
  color:#000;
  display:block;
  transition:0.25s ease;
  position:relative;
  z-index:1;
  pointer-events:auto; /* 🔥 KLJUČ */
}

.card:hover{
  transform:translateY(-10px);
  border:1px solid #B91F2A;
}

/* FAQ */
.faq{padding:80px;}

.faq-item{
  background:#fff;
  border:1px solid #e5e5e7;
  margin-bottom:12px;
}

.faq-question{
  padding:22px;
  font-family:Anton;
  cursor:pointer;
}

/* MOBILE */
@media(max-width:768px){
body{cursor:auto;}
#cursor{display:block;}
.services{grid-template-columns:1fr;}
.hero{padding:120px 20px;}
}

</style>
</head>

<body>

<div id="cursor"></div>

<nav>
  <div class="brand">LIONSIGN</div>
  <a href="https://www.facebook.com/kristina.radosavljevic">CONTACT</a>
</nav>

<div class="hero">
  <h1><span>DESIGN</span> BUILDS DOMINANCE</h1>
</div>

<div class="services">

<a href="https://preview.mailerlite.io/preview/2126552/sites/186170656816104474/lionsign-research-design-tqdlog" class="card">
01 DOBERMAN BRANDING
</a>

<a href="https://preview.mailerlite.io/preview/2126552/sites/180110322571413099/Uysoji" class="card">
02 DIGITAL DESIGN
</a>

<a href="https://preview.mailerlite.io/preview/2126552/sites/186276712092272536/lionsign-research-design-1h32yv" class="card">
03 LANDSCAPE DESIGN
</a>

<a href="https://preview.mailerlite.io/preview/2126552/sites/180559352095048839/3N6yet" class="card">
04 OBSIDIAN LINE
</a>

</div>

<div class="faq">

<div class="faq-item">
<div class="faq-question">What happens?</div>
<div class="faq-answer">Opens page.</div>
</div>

</div>

<script>

/* FAQ */
document.querySelectorAll(".faq-item").forEach(i=>{
  i.addEventListener("click",()=>i.classList.toggle("active"));
});

/* CURSOR FIXED */
const cursor = document.getElementById("cursor");

let x=0,y=0,tx=0,ty=0;

document.addEventListener("mousemove",e=>{
  tx=e.clientX;
  ty=e.clientY;
});

document.addEventListener("touchmove",e=>{
  const t=e.touches[0];
  tx=t.clientX;
  ty=t.clientY;
},{passive:true});

function loop(){
  x+=(tx-x)*0.12;
  y+=(ty-y)*0.12;

  cursor.style.left=x+"px";
  cursor.style.top=y+"px";

  requestAnimationFrame(loop);
}
loop();

/* hover only */
document.querySelectorAll("a,.card,.faq-question").forEach(el=>{
  el.addEventListener("mouseenter",()=>cursor.classList.add("active"));
  el.addEventListener("mouseleave",()=>cursor.classList.remove("active"));
});

</script>

</body>
</html>
