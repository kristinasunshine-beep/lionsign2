<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LIONSIGN</title>

<style>

body{
  cursor:none;
}

/* CURSOR */
#cursor{
  width:12px;
  height:12px;
  border:2px solid #B91F2A;
  border-radius:50%;
  position:fixed;
  left:0;
  top:0;
  transform:translate(-50%,-50%);
  pointer-events:none;
  z-index:99999;
  transition:width .15s ease,height .15s ease,background .15s ease;
}

#cursor.active{
  width:48px;
  height:48px;
  background:rgba(185,31,42,0.12);
}

</style>
</head>

<body>

<div id="cursor"></div>

<a href="#" class="card">CARD</a>
<nav><a href="#">LINK</a></nav>

<script>

const cursor = document.getElementById("cursor");

let x = 0, y = 0;
let tx = 0, ty = 0;

const interactive = "a, .card, nav a, .faq-question";

/* ✔ SINGLE SOURCE OF TRUTH */
document.addEventListener("pointermove", (e) => {
  tx = e.clientX;
  ty = e.clientY;
});

/* ✔ PROPER HOVER STATE (no flicker, no glitch) */
document.addEventListener("pointerover", (e) => {
  if (e.target.closest(interactive)) {
    cursor.classList.add("active");
  }
});

document.addEventListener("pointerout", (e) => {
  if (e.target.closest(interactive)) {
    cursor.classList.remove("active");
  }
});

/* ✔ JOYSTICK / INERTIA ENGINE */
function loop(){
  x += (tx - x) * 0.14;
  y += (ty - y) * 0.14;

  cursor.style.left = x + "px";
  cursor.style.top = y + "px";

  requestAnimationFrame(loop);
}
loop();

</script>

</body>
</html>
